name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: toka09

          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E6EDF3&color_dots=#161B22,#1D2733,#243B55,#315A82,#4F7DF3

      - name: Push snake files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
